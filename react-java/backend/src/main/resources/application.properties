server.port=9090
spring.application.name=worldcup-backend

# PostgreSQL (Docker : docker compose up -d depuis react-java/)
spring.datasource.url=jdbc:postgresql://localhost:5432/cdm2026
spring.datasource.username=cdm
spring.datasource.password=cdm2026
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.initialization-fail-timeout=-1

# false = données réelles (API + BDD)
app.use-mock-data=false
app.worldcup2026.api-url=https://worldcup26.ir
app.worldcup2026.cache-ttl-ms=300000

# Synchronisation worldcup26.ir → PostgreSQL (comme sync-worldcup2026.mjs)
app.sync.enabled=true
app.sync.interval-ms=300000
app.sync.advisory-lock-key=20260611

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
